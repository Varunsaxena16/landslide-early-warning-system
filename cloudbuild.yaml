# Google Cloud Build → Artifact Registry → Cloud Run.
#   gcloud builds submit --config cloudbuild.yaml --substitutions=_REGION=asia-south1
substitutions:
  _SERVICE: sikkim-landslide
  _REGION: asia-south1      # Mumbai

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "gcr.io/$PROJECT_ID/${_SERVICE}:$SHORT_SHA",
                    "-t", "gcr.io/$PROJECT_ID/${_SERVICE}:latest", "."]

  - name: gcr.io/cloud-builders/docker
    args: ["push", "--all-tags", "gcr.io/$PROJECT_ID/${_SERVICE}"]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=gcr.io/$PROJECT_ID/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --memory=1Gi
      - --cpu=1
      - --concurrency=40
      - --timeout=60
      - --min-instances=0        # scale to zero; first request pays a cold start
      - --port=8080

images:
  - gcr.io/$PROJECT_ID/${_SERVICE}:$SHORT_SHA
  - gcr.io/$PROJECT_ID/${_SERVICE}:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
